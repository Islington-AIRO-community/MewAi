[pytest]
# `auto` lets a bare `async def test_...` run without a per-test marker.
#
# This matters more than it looks: with no asyncio plugin at all, pytest emits a
# warning and *skips* async tests, so a suite of them reports as passing while
# nothing was actually asserted. Any async test in this project must therefore
# be checked against the collected count, not just the exit code.
asyncio_mode = auto
# Pinned rather than left to drift: pytest-asyncio warns that the default will
# change, and the change is a behavioural one (loop scope per function vs per
# module). There are no async fixtures here yet, so fixing it now costs one line
# and spares the next person a warning on every run.
asyncio_default_fixture_loop_scope = function
testpaths = app/tests
